%YAML:1.2
# SPDX-FileCopyrightText: 2021 Smart Robotics Lab, Imperial College London, Technical University of Munich
# SPDX-License-Identifier: CC0-1.0

map:
  dim:                        [35, 35, 35]
  res:                        0.1

data:
  # tsdf
  truncation_boundary_factor: 8
  max_weight:                 100

  # occupancy
  log_odd_min:                -5.015
  log_odd_max:                 5.015
  fs_integr_scale:            1
  uncertainty_model:          linear
  tau_min_factor:             3
  tau_max_factor:             12
  k_tau:                      0.05
  sigma_min_factor:           1         # minimum/maximum uncertainty := 3 x sigma_min_factor/sigma_max_factor * voxel_dim
  sigma_max_factor:           3         # minimum/maximum uncertainty := 3 x sigma_min_factor/sigma_max_factor * voxel_dim
  k_sigma:                    0.05

sensor:
  width:                      640
  height:                     480
  fx:                         390.598938
  fy:                         390.598938
  cx:                         320.0
  cy:                         240.0
  near_plane:                 0.4
  far_plane:                  35.0
  T_BS: [ 0, 0, 1, 0.1165,
          -1, 0, 0, 0.04802,
          0, -1, 0, -0.0373,
          0, 0, 0, 1]

tracker:
  iterations:                 [10, 5, 4]
  dist_threshold:             0.1
  normal_threshold:           0.8
  track_threshold:            0.15
  icp_threshold:              0.00001

reader:
  reader_type:                "tum"
  sequence_path:              "/usr/wiss/weji/Datasets/ship_CH_data"
  ground_truth_file:          "/usr/wiss/weji/Datasets/ship_CH_data/groundtruth.txt"
  fps:                        0.0
  drop_frames:                false
  verbose:                    0

app:
  enable_ground_truth:        true
  enable_rendering:           true
  enable_gui:                 true
  mesh_path:                  "/usr/wiss/weji/Downloads/ship_CH_data/meshes"
  slice_path:                 ""
  structure_path:             ""
  sensor_downsampling_factor: 2
  tracking_rate:              1
  integration_rate:           1
  rendering_rate:             1
  meshing_rate:               0
  max_frames:                 -1
  log_file:                   "/tmp/log.tsv"